version: 2

models:
  - name: customer_sales_summary
    description: "Customer-level sales and profit summary for completed orders."

    columns:
      - name: customer_key
        description: "Unique warehouse key for the customer."
        data_tests:
          - not_null
          - unique

      - name: total_orders
        description: "Number of completed orders for the customer."
        data_tests:
          - not_null

      - name: total_units
        description: "Total quantity of products purchased."
        data_tests:
          - not_null

      - name: total_revenue
        description: "Total revenue generated by the customer."
        data_tests:
          - not_null

      - name: total_profit
        description: "Total profit generated by the customer."
        data_tests:
          - not_null